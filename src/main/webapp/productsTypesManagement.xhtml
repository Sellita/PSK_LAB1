<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<h:head/>
<h:body>
    <h1>Products types:</h1>
    <ol>
        <ui:repeat value="#{productsTypeManagementController.allProductsTypes}" var="productType">
            <li><h:link value="#{productType.name}"  /></li>
        </ui:repeat>
    </ol>

    <h:form>
        <h:inputText value="#{productsTypeManagementController.productTypeToCreate.name}" required="true" />
        <h:commandButton value="Add new product type" actionListener="#{productsTypeManagementController.createProductType}" action="index?faces-redirect=true"/>
    </h:form>

    <a href="index.xhtml">Home page</a>
</h:body>
</html>
