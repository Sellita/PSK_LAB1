<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<h:head/>
<h:body>
    <h1>Fridges:</h1>
    <ol>
        <ui:repeat value="#{fridgeManagementController.allFridges}" var="fridge">
            <li><h:link value="#{fridge.name}"  outcome="fridge?fridgeId=#{fridge.id}" /></li>
        </ui:repeat>
    </ol>

    <h:form>
        <h:inputText value="#{fridgeManagementController.fridgeToCreate.name}" required="true" />
        <h:selectOneMenu value="#{fridgeManagementController.manufacturerId}">
            <f:selectItems value="#{fridgeManagementController.manufacturers}" var="manufacturer" itemValue="#{manufacturer.id}" itemLabel="#{manufacturer.name}" />
        </h:selectOneMenu>
        <h:commandButton value="Add new fridge" actionListener="#{fridgeManagementController.createFridge}" action="index?faces-redirect=true"/>
    </h:form>

    <a href="index.xhtml">Home page</a>
</h:body>
</html>
