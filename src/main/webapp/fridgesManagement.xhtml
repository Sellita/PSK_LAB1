<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<h:head/>
<h:body>
    <h1>Fridges:</h1>
    <ol>
        <ui:repeat value="#{fridgeController.allFridges}" var="fridge">
            <li><h:link value="#{fridge.name}"  /></li>
        </ui:repeat>
    </ol>

    <h:form>
        <h:inputText value="#{fridgeController.fridgeToCreate.name}" required="true" />
        <h:commandButton value="Add new fridge" actionListener="#{fridgeController.createFridge}" action="index?faces-redirect=true"/>
    </h:form>

    <a href="index.xhtml">Home page</a>
</h:body>
</html>
