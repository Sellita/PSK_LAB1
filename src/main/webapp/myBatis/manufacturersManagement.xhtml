<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<h:head/>
<h:body>
    <h1>Manufacturers:</h1>
    <ol>
        <ui:repeat value="#{myBatisManufacturerManagementController.allManufacturers}" var="manufacturer">
            <li><h:link value="#{manufacturer.name}"  /></li>
        </ui:repeat>
    </ol>

    <h:form>
        <h:inputText value="#{myBatisManufacturerManagementController.manufacturerToCreate.name}" required="true" />
        <h:commandButton value="Add new manufacturer" actionListener="#{myBatisManufacturerManagementController.createManufacturer}" action="index?faces-redirect=true"/>
    </h:form>

    <a href="index.xhtml">Home page</a>
</h:body>
</html>
